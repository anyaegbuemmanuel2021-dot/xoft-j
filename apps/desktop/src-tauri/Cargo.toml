[package]
name = "xoft-desktop"
version = "0.3.0"
description = "XOFT Universal Desktop Agent"
authors = ["XOFT"]
edition = "2021"

[lib]
name = "xoft_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.8.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]
