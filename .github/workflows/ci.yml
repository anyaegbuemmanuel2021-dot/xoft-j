name: XOFT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xoft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run backend test suite
        run: npm test

  docker-build:
    name: Production Docker image
    runs-on: ubuntu-latest
    needs: backend-tests
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag xoft:ci .
      - name: Start container and smoke-test health/readiness endpoints
        shell: bash
        run: |
          docker run -d --name xoft-smoke -p 3000:3000 -e NODE_ENV=development xoft:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs xoft-smoke
              exit 1
            fi
            sleep 2
          done
          readyz="$(curl -fsS http://127.0.0.1:3000/readyz)"
          echo "$readyz"
          echo "$readyz" | grep -q '"durable":false'
      - name: Clean up smoke-test container
        if: always()
        run: docker rm -f xoft-smoke || true

  universal-apps:
    name: Shared protocol, mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --lockfile=false
      - name: Typecheck shared protocol, mobile app and build desktop app
        run: pnpm run universal:check
