name: Import uploaded Xoft ZIP

on:
  push:
    paths:
      - "xoft-v0.0.1.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="xoft-v0.0.1.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Upload xoft-v0.0.1.zip to the repository root first."
            exit 1
          fi
          mkdir -p /tmp/xoft-import
          unzip -q "$ARCHIVE" -d /tmp/xoft-import
          ROOT="$(find /tmp/xoft-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -n "$ROOT" ] && [ -d "$ROOT" ]; then
            rsync -a --exclude='.git' "$ROOT/" ./
          else
            rsync -a /tmp/xoft-import/ ./
          fi
          rm -rf /tmp/xoft-import "$ARCHIVE"

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Import Xoft v0.0.1 project archive"
          git push
