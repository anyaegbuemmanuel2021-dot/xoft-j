name: Release
on:
  push:
    tags: ['v*']
jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
        working-directory: android-companion
      - uses: actions/upload-artifact@v4
        with:
          name: xoft-companion-release
          path: |
            android-companion/app/build/outputs/apk/release/*.apk
            android-companion/app/build/outputs/bundle/release/*.aab
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: xoft-core:${{ github.ref_name }}
