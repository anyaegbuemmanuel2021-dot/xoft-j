name: XOFT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: xoft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, tests, and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies (retry transient registry failures)
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-timeout=300000
      - name: Check server and browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src public/js -type f -name '*.js' -print0)
      - name: Audit dependencies and retain machine-readable report
        id: dependency_audit
        continue-on-error: true
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ github.run_id }}
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce dependency audit gate
        if: steps.dependency_audit.outcome == 'failure'
        run: |
          echo "Dependency audit failed. Download the npm-audit-report artifact for details."
          exit 1
      - name: Run automated tests
        run: npm test
      - name: Build deployment image
        run: docker build --tag xoft-ci:latest .

      - name: Run production-container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name xoft-smoke \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e AUTH_API_KEYS=ci-smoke-test-key-not-a-secret \
            -e STORAGE_MODE=sqlite \
            -e SQLITE_PATH=/app/data/xoft.sqlite \
            -p 127.0.0.1:3000:3000 \
            xoft-ci:latest
          cleanup() {
            docker logs xoft-smoke || true
            docker rm -f xoft-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /tmp/xoft-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "XOFT container did not become healthy in time."
              exit 1
            fi
            sleep 2
          done

          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.deepEqual(JSON.parse(fs.readFileSync('/tmp/xoft-health.json', 'utf8')), { ok: true, service: 'xoft-core' });"
          curl --fail --silent http://127.0.0.1:3000/readyz > /tmp/xoft-ready.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const r = JSON.parse(fs.readFileSync('/tmp/xoft-ready.json', 'utf8')); assert.equal(r.ok, true); assert.equal(r.service, 'xoft-core'); assert.ok(r.storage);"
