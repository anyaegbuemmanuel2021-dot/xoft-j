name: XOFT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xoft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, tests, and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check server and browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src public/js -type f -name '*.js' -print0)
      - name: Run automated tests
        run: npm test
      - name: Build deployment image
        run: docker build --tag xoft-ci:latest .
